[changelog]
header = """
# Otoha changelog

Release notes are generated from Conventional Commits.
"""
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} **BREAKING**{% endif %}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
    { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
    { message = "^test", group = "<!-- 5 -->🧪 Tests" },
    { message = "^build", group = "<!-- 6 -->🔧 Build" },
    { message = "^ci", group = "<!-- 7 -->✅ CI" },
    { message = "^chore|^style", group = "<!-- 8 -->🛠️ Maintenance" },
    { message = "^revert", group = "<!-- 9 -->↩️ Reverts" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
