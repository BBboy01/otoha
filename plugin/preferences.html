<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otoha 设置</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: CanvasText;
        background: Canvas;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; max-width: 720px; }
      section { margin-bottom: 20px; }
      h2 { margin: 0 0 8px; font-size: 13px; }
      label { display: block; margin-bottom: 5px; font-weight: 600; }
      input { width: 100%; min-height: 32px; padding: 5px 8px; border: 1px solid color-mix(in srgb, CanvasText 24%, transparent); border-radius: 5px; color: CanvasText; background: color-mix(in srgb, CanvasText 4%, Canvas); font: inherit; }
      .check-row { display: flex; align-items: center; gap: 7px; }
      .check-row input { width: auto; min-height: auto; margin: 0; }
      p { margin: 5px 0 0; color: color-mix(in srgb, CanvasText 62%, transparent); font-size: 12px; }
    </style>
  </head>
  <body>
    <section>
      <h2>FFmpeg</h2>
      <label for="ffmpeg-path">可执行文件路径</label>
      <input id="ffmpeg-path" type="text" data-pref-key="ffmpeg_path" autocomplete="off" spellcheck="false" placeholder="留空时从 PATH 查找" />
      <p>留空时从当前环境的 PATH 查找；也可以填写 FFmpeg 的绝对路径。</p>
    </section>
    <section>
      <h2>字幕库</h2>
      <label for="output-directory">字幕库根目录</label>
      <input id="output-directory" type="text" data-pref-key="output_directory" autocomplete="off" spellcheck="false" placeholder="留空时使用 Otoha 字幕库" />
      <p>留空时使用 ~/Library/Application Support/Otoha/Subtitles。每个视频单独存放，重新生成同一语言配置会覆盖对应字幕，其他版本保留。</p>
    </section>
    <section>
      <h2>自动处理字幕</h2>
      <label class="check-row"><input type="checkbox" data-pref-key="auto_load" /> 开启自动加载和转录</label>
      <p>有已有字幕时自动加载，没有时按当前音轨语言生成；无法识别音轨语言时不会自动启动。</p>
    </section>
  </body>
</html>
