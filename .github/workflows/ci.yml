name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package plugin
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test plugin
        run: npm test --prefix plugin

      - name: Test helper
        run: swift test --package-path helper

      - name: Build and verify plugin bundle
        run: |
          package_path="$RUNNER_TEMP/Otoha.iinaplugin"
          bash scripts/package-plugin.sh "$package_path"
          bash scripts/verify-plugin-package.sh "$package_path"
          tampered_path="$RUNNER_TEMP/Otoha-tampered.iinaplugin"
          cp -R "$package_path" "$tampered_path"
          mkdir -p "$tampered_path/assets"
          printf 'unexpected resource\n' > "$tampered_path/assets/unlisted.js"
          if bash scripts/verify-plugin-package.sh "$tampered_path"; then
            printf 'Verifier accepted an unlisted package resource.\n' >&2
            exit 1
          fi
          cp /usr/bin/true "$tampered_path/bin/OtohaHelper.app/Contents/MacOS/otoha-helper"
          if bash scripts/verify-plugin-package.sh "$tampered_path"; then
            printf 'Verifier accepted a replaced helper binary.\n' >&2
            exit 1
          fi

      - name: Smoke test helper background CLI
        run: |
          helper_bin="$(swift build -c release --package-path helper --show-bin-path)/otoha-helper"
          invalid_output="$("$helper_bin" --request-json '{}')"
          printf '%s\n' "$invalid_output" | node -e '
            const fs = require("node:fs");
            const event = JSON.parse(fs.readFileSync(0, "utf8"));
            if (event.type !== "error" || event.code !== "helper.invalidRequest" || event.jobId !== "unknown") process.exit(1);
          '
          list_output="$("$helper_bin" --list-subtitles-json '{"mediaPath":"/tmp/otoha-sample.mkv","outputDirectoryPath":"/tmp/otoha-subtitles"}')"
          printf '%s\n' "$list_output" | node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(0, "utf8"));
            if (response.rootDirectoryPath !== "/tmp/otoha-subtitles" || !Array.isArray(response.files)) process.exit(1);
          '

      - name: Archive release plugin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_path="$RUNNER_TEMP/Otoha.iinaplugin"
          archive_path="$RUNNER_TEMP/Otoha-${RELEASE_TAG}-macos-arm64.iinaplgz"
          (
            cd "$package_path"
            zip -r "$archive_path" *
          )
          unzip -t "$archive_path"

      - name: Upload release plugin artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: otoha-plugin-${{ github.ref_name }}
          path: ${{ runner.temp }}/Otoha-${{ github.ref_name }}-macos-arm64.iinaplgz
          if-no-files-found: error

  changelog:
    name: Validate git-cliff configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate unreleased notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          version: v2.14.2
          args: --unreleased --strip header
        env:
          OUTPUT: ${{ runner.temp }}/otoha-unreleased-notes.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: otoha-plugin-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify downloaded release plugin
        run: |
          archive_path="$(find "$RUNNER_TEMP/release-assets" -type f -name '*.iinaplgz' -print -quit)"
          test -n "$archive_path"
          unzip -t "$archive_path"
          package_path="$RUNNER_TEMP/release-package"
          mkdir -p "$package_path"
          unzip -q "$archive_path" -d "$package_path"
          bash scripts/verify-plugin-package.sh "$package_path"

      - name: Check tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          plugin_version="$(node -p "require('./plugin/Info.json').version")"
          if [[ "$tag_version" != "$plugin_version" ]]; then
            printf 'Tag version %s does not match plugin version %s.\n' "$tag_version" "$plugin_version" >&2
            exit 1
          fi

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          version: v2.14.2
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/otoha-release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish release notes
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.git-cliff.outputs.changelog }}
          files: ${{ runner.temp }}/release-assets/*.iinaplgz
          fail_on_unmatched_files: true

      - name: Re-download and verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_dir="$RUNNER_TEMP/published-release"
          mkdir -p "$published_dir"
          for attempt in {1..10}; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.iinaplgz' \
              --dir "$published_dir" \
              --clobber || true
            if find "$published_dir" -type f -name '*.iinaplgz' -print -quit | grep -q .; then
              break
            fi
            sleep 3
          done
          archive_path="$(find "$published_dir" -type f -name '*.iinaplgz' -print -quit)"
          test -n "$archive_path"
          unzip -t "$archive_path"
          package_path="$RUNNER_TEMP/published-package"
          mkdir -p "$package_path"
          unzip -q "$archive_path" -d "$package_path"
          bash scripts/verify-plugin-package.sh "$package_path"
